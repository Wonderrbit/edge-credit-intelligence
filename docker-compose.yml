services:
  api:
    build: .
    image: akropoli-credit:local
    command: ["uvicorn", "mlops.serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  autopilot:
    build: .
    image: akropoli-credit:local
    command: ["python", "scripts/run_autopilot.py", "--mode", "full"]
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
    profiles: ["jobs"]
    restart: "no"
