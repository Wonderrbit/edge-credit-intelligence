[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-credit-intelligence"
version = "0.1.0"
description = "Edge credit, collections and limit intelligence with a LangGraph/RAG decision agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "shap>=0.46",
  "matplotlib>=3.8",
  "tensorflow>=2.16",
  "tf-keras>=2.16",
  "duckdb>=1.0",
  "pyarrow>=15.0",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "openai>=1.40",
  "typesafe-sdk>=0.7.5",
  "mcp>=1.0",
  "rank-bm25>=0.2",
  "sentence-transformers>=3.0",
  "python-dotenv>=1.0",
  "toon-format>=1.2",
  "pyyaml>=6.0",
  "mlflow>=2.16",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that train models or build the full pipeline",
  "integration: tests that use generated artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "artifacts", "mlruns", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mlops/serving/api.py" = ["B008"]
