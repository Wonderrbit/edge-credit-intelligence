name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MLOPS_USE_JEV: "0"
      MLOPS_USE_LLM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Hydrate demo artifacts
        run: python scripts/make_demo_assets.py
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Tests
        run: python -m pytest -q
      - name: Offline autopilot smoke
        run: python scripts/run_autopilot.py --mode full --dry-run --limit 10

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: edge-credit-intelligence:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name api -p 8000:8000 edge-credit-intelligence:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"
          curl -fsS http://127.0.0.1:8000/model/info >/dev/null
          curl -fsS http://127.0.0.1:8000/score/C000001 >/dev/null
          docker logs api
          docker rm -f api
